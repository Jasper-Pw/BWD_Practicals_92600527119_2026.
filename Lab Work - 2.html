<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Design</title>
</head>
<style>
    .small{
        width: 20%;
    }
    .medium{
        width: 35%;
    }
    .big{
        width: 50%;
    }
</style>
<body>
    <table border="1" cellspacing ="0" cellpadding="35">
        <tr>
            <td class="small"></td>
            <td class="medium"></td>
            <td class="big"></td>
        </tr>
        <tr>
            <td colspan="2" rowspan="2"></td>
            <td></td>
        </tr>
        <tr>
            <td></td>
        </tr>
    </table>
</body>
</html>
