<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blood Bank Registration</title>
  </head>
  <body>
    <h3>Blood Bank Registration</h3>
    <form>

      <label for="name">Name:</label>
      <Input type="text" id="name" placeholder="e.g., Justin Bieber">
      
      <br><br>

      <label for="age">Age:</label>
      <input type="text" id="age" placeholder="e.g., 20th">

      <br><br>

      <label for="bloudgroup">Bloud Group:</label>
      <select name="bloudgroup" id="bloudgroup">
        <option value="selectvalue" disabled selected hidden>Select Value</option>
        <option value="AB-">AB-</option>
        <option value="AB+">AB+</option>
        <option value="A-">A-</option>
        <option value="A+">A+</option>
        <option value="B-">B-</option>
        <option value="B+">B+</option>
        <option value="Oh-">Oh-</option>
        <option value="Oh+">Oh+</option>
        <option value="O-">O-</option>
        <option value="O+">O+</option>

      <br><br>

      </select>
      <label for="gender">Gender:</label>
      <select name="gender" id="gender">
        <option value="selectvalue" disabled selected hidden>Select Value</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Transgender">Transgender</option>
      </select>
      
      <br><br>

      <label for="mobilenumber">Mobile Number:</label>
      <input type="text" id="mobilenumber" placeholder="+91 12345 67890">

      <br><br>

      <label for="address">Address:</label>
      <input type="text" id="address" placeholder="e.g., St Jaya Selalu">

      <br><br>

      <button>Submit</button>
    </form>
  </body>
</html>
